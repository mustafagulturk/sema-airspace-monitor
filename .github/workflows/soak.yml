name: Soak

# Long-running memory test: replays the synthetic recordings for weeks of
# simulated time through the collector's in-memory pipeline and fails if the
# resident memory keeps growing once every rolling window is full. The ASan
# run also fails on any leak LeakSanitizer finds at exit.
on:
  schedule:
    - cron: "17 3 * * 1"  # Mondays 03:17 UTC
  workflow_dispatch:
    inputs:
      days:
        description: "Simulated days for the release run"
        default: "60"
  pull_request:
    paths: ["src/**", "include/**", "apps/**", "CMakeLists.txt", ".github/workflows/soak.yml"]

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

env:
  DEPS: ninja-build libcurl4-openssl-dev nlohmann-json3-dev libpqxx-dev libboost-dev

jobs:
  soak:
    name: soak / ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Collector's real windows: 24 h replay/coverage, 31 day flight history.
          # Days come from the run (60 weekly, 40 on pull requests).
          - name: release
            preset: release
            replay_args: --warmup-days 32 --max-growth-mb 16
            anomaly_args: --days 14 --keep-flights-days 3 --warmup-days 4 --max-growth-mb 16
          # Short windows so steady state comes quickly under ASan's overhead.
          - name: asan
            preset: asan
            replay_args: --days 3 --keep-flights-days 1 --warmup-days 2 --max-growth-mb 64
            anomaly_args: --days 3 --keep-flights-days 1 --warmup-days 2 --max-growth-mb 64
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update -q && sudo apt-get install -y -q $DEPS
      - name: Build
        # Soak measures memory, not warnings (the -O2 libpqxx headers warn under GCC 13).
        run: |
          cmake --preset ${{ matrix.preset }} -DSEMA_WARNINGS_AS_ERRORS=OFF -DSEMA_BUILD_TESTS=OFF
          cmake --build --preset ${{ matrix.preset }} --target sema_soak
      - name: Soak (tracking fixture)
        run: |
          days="${{ github.event.inputs.days }}"
          [ -n "$days" ] || days=$([ "${{ github.event_name }}" = pull_request ] && echo 40 || echo 60)
          # --days given later in the matrix args (asan) overrides this one.
          ./build/${{ matrix.preset }}/sema_soak tests/fixtures/replay_synthetic.jsonl --days "$days" \
            ${{ matrix.replay_args }} --csv soak-replay-${{ matrix.name }}.csv
      - name: Soak (anomaly fixture)
        run: |
          ./build/${{ matrix.preset }}/sema_soak tests/fixtures/anomaly_synthetic.jsonl --quiet \
            ${{ matrix.anomaly_args }} --csv soak-anomaly-${{ matrix.name }}.csv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: soak-${{ matrix.name }}
          path: soak-*.csv
